// ts = time of the newest message you have seen (from Supabase's clock, so a wrong computer clock can't cause false dots)
// what you have read is also saved in Supabase, so your phone and computer agree (supabase-chat-seen.sql)
let SEENQ={},SEENT=0;
function pushSeen(r,t){if(!SB||!me)return;SEENQ[r]=t;clearTimeout(SEENT);SEENT=setTimeout(()=>{const rows=Object.entries(SEENQ).map(([room,seen_at])=>({room,seen_at}));SEENQ={};SB.rpc("mark_seen",{p_rows:rows}).then(()=>{},()=>{})},1500)}
async function pullSeen(){if(!SB||!me)return;try{const{data,error}=await SB.from("chat_seen").select("room,seen_at");if(error||!data)return;data.forEach(x=>{const o=seenAt(x.room);if(!o||new Date(x.seen_at)>new Date(o)){try{localStorage.setItem(seenKey(x.room),x.seen_at)}catch(e){}}})}catch(e){}}
function markSeen(r,ts){if(!r||r==="bot")return;const old=seenAt(r),t=ts||new Date().toISOString();if(!old||new Date(t)>new Date(old)){try{localStorage.setItem(seenKey(r),t)}catch(e){}pushSeen(r,t)}if(UNREAD.delete(r))updateChatDot()}
// Only rooms that still exist and private chats with current friends can have a dot
const validRoom=r=>!!r&&(r.startsWith("g:")||r.startsWith("af:")||chatFriends().some(f=>dmId(f.id)===r));
const newerThanSeen=(r,t)=>{const s=seenAt(r);return!!s&&new Date(t)>new Date(s)};
// Phone menu: copy red dots from the top menu to the bottom bar and the More panel; More gets a dot if anything inside it has one
function syncBar(){const top=k=>{const b=$(".bar nav [data-t="+k+"]");return!!(b&&b.classList.contains("hasdot"))};document.querySelectorAll(".tabbar [data-t], #more [data-t]").forEach(b=>{b.classList.toggle("hasdot",top(b.dataset.t));b.setAttribute("aria-current",b.dataset.t===tab?"page":"false")});
const mb=$(".tabbar [data-more]");if(mb){mb.classList.toggle("hasdot",!!document.querySelector("#more .hasdot"));mb.classList.toggle("on",!!document.querySelector("#more [aria-current=page]"))}}
function updateChatDot(){const b=$(".bar nav [data-t=chat]");if(b){b.classList.toggle("hasdot",UNREAD.size>0);b.setAttribute("aria-label",UNREAD.size?"Chat, new messages from friends":"Chat")}document.querySelectorAll("[data-room]").forEach(e=>e.classList.toggle("hasdot",UNREAD.has(e.dataset.room)));syncBar()}

async function checkUnread(){if(!(SB&&me))return;await pullSeen();// only chats you're in can be read (Supabase checks), so every message here is from a chat of yours
const r=await SB.from("messages").select("room,created_at,user_id,name").neq("user_id",me.id).order("created_at",{ascending:false}).limit(300);if(!r.data)return;const done=new Set(),af0=AFACT.size;
const initK="rf_seeninit_"+PK(),firstRun=(()=>{try{return!localStorage.getItem(initK)}catch(e){return false}})();
r.data.forEach(m=>{if(!validRoom(m.room))return;if(m.room.startsWith("af:"))AFACT.add(m.room);if(done.has(m.room))return;done.add(m.room);if(m.room.startsWith("g:")&&GROUPS&&!groupOf(m.room))loadGroups(true);
if(!seenAt(m.room)&&firstRun){markSeen(m.room,m.created_at);return}/* the very first time, older messages count as read */
if((!seenAt(m.room)||newerThanSeen(m.room,m.created_at))&&!(tab==="chat"&&room===m.room))UNREAD.add(m.room);else UNREAD.delete(m.room)});try{localStorage.setItem(initK,"1")}catch(e){}updateChatDot();if(tab==="chat"&&AFACT.size!==af0&&!(($("#msgin")||{}).value))render()}
function startInbox(){if(!(SB&&me)||inboxCh)return;setTimeout(claimInvite,2500);setTimeout(()=>SB.rpc("weekly_tick").then(()=>{},()=>{}),4000);checkAdmin();loadSafety();loadNotices();seasonTick();LOGIN_NOTE="";inboxCh=SB.channel("rf-inbox").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{const m=p.new;if(!me||!m.room||m.user_id===me.id)return;if(!validRoom(m.room))return;if(m.room.startsWith("af:")&&!AFACT.has(m.room)){AFACT.add(m.room);if(tab==="chat"&&!(($("#msgin")||{}).value))render()}if(m.room.startsWith("g:")&&!groupOf(m.room))loadGroups(true);if(tab==="chat"&&room===m.room){markSeen(m.room,m.created_at)}else{UNREAD.add(m.room);updateChatDot()}}).on("postgres_changes",{event:"INSERT",schema:"public",table:"friendships"},p=>{if(me&&p.new.friend_id===me.id)checkRequests()}).on("postgres_changes",{event:"*",schema:"public",table:"trades"},()=>loadTrades()).subscribe();loadTrades();checkRequests().then(()=>loadGroups(true)).then(checkUnread);clearInterval(reqT);reqT=setInterval(checkRequests,120000)}

// Each game picks questions you haven't had lately (every question comes up before any repeats), with the answers in a new order
function pickQs(bank,key,n){let seen=[];try{seen=JSON.parse(localStorage.getItem("rf_qseen_"+key)||"[]")}catch(e){}
let pool=bank.filter(q=>!seen.includes(q[0])).sort(()=>Math.random()-.5);if(pool.length<n){pool=pool.concat(bank.filter(q=>!pool.includes(q)).sort(()=>Math.random()-.5)).slice(0,n);seen=[]}

/* ---- SEARCH: one box for teams, players and news. Tap a result for all its stats (tables, form, results, fixtures, cards). ---- */
let SQ="",SVIEW=null;
const snorm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const lgName=c=>c==="CL"?"Champions League":(LGS.find(l=>l[0]===c)||[0,c])[1];
// table names and card club names don't always match ("Barça" / "Barcelona"), so a few aliases help link them
const CLUB_ALIAS={"barca":"barcelona","man city":"manchester city","man united":"manchester united","atleti":"atletico","psg":"paris saint-germain","sl benfica":"benfica","sporting cp":"sporting","bayern":"bayern munich","inter":"inter","spurs":"tottenham","newcastle":"newcastle","leverkusen":"leverkusen","dortmund":"dortmund","olympique lyon":"lyon","marseille":"marseille"};
const sameClub=(a,b)=>{const x=snorm(a),y=snorm(b),ax=CLUB_ALIAS[x]||x,by=CLUB_ALIAS[y]||y;return x===y||ax===by||(ax.length>3&&by.includes(ax))||(by.length>3&&ax.includes(by))};
function allTeams(){const m=new Map();for(const[lg,rows]of Object.entries((DATA&&DATA.leagues)||{}))(rows||[]).forEach((r,i)=>{if(!m.has(r[0]))m.set(r[0],{name:r[0],tables:[]});m.get(r[0]).tables.push({lg,pos:i+1,w:r[1],d:r[2],l:r[3],pts:r[4],gd:r[5],of:rows.length})});return[...m.values()]}
const matchesOf=t=>{const seen=new Set();return[...(DATA.hist||[]),...(DATA.res||[])].filter(m=>(m.h===t||m.a===t)&&m.hs!=null&&!seen.has(m.id)&&seen.add(m.id)).sort((a,b)=>b.t.localeCompare(a.t))};
const ordinal=n=>n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");
const sDate=t=>new Date(t).toLocaleDateString(ST.lang==="pt"?"pt-PT":ST.lang==="es"?"es-ES":"en-GB",{day:"numeric",month:"short"});
const sTime=t=>new Date(t).toLocaleString(ST.lang==="pt"?"pt-PT":ST.lang==="es"?"es-ES":"en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

// Blog text formatting (shared by the admin editor and blog/post.html). Everything is escaped first, then only these are allowed:
// ## heading, ### small heading, **bold**, - list item, > tip box, [text](address). Addresses: blog pages, game links, https.
function mdToHtml(src){const E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const okHref=h=>!/^\s*javascript:/i.test(h)&&(/^https:\/\/[^\s"'<>]+$/i.test(h)||/^[a-z0-9-]+\.html(#[a-z0-9-]+)?$/i.test(h)||/^post\.html\?p=[a-z0-9-]+$/i.test(h)||/^\.\.\/(\?(tab|play)=[a-z]+)?$/i.test(h)||/^#[a-z0-9-]+$/i.test(h));
  const inline=t=>E(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,txt,href)=>{const h=href.replace(/&amp;/g,"&");return okHref(h)?`<a href="${E(h)}"${/^https:/i.test(h)?' target="_blank" rel="noopener"':""}>${txt}</a>`:txt});
  const out=[];let para=[],list=[];const flush=()=>{if(para.length){out.push(`<p>${para.map(inline).join("<br>")}</p>`);para=[]}if(list.length){out.push(`<ul>${list.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`);list=[]}};
  String(src||"").replace(/\r/g,"").split("\n").forEach(line=>{const l=line.trim();
    if(!l){flush();return}
    if(l.startsWith("### ")){flush();out.push(`<h3>${inline(l.slice(4))}</h3>`);return}
    if(l.startsWith("## ")){flush();const t=l.slice(3);out.push(`<h2 id="${E(t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60))}">${inline(t)}</h2>`);return}
    if(/^[-*] /.test(l)){if(para.length){out.push(`<p>${para.map(inline).join("<br>")}</p>`);para=[]}list.push(l.slice(2));return}
    if(l.startsWith("> ")){flush();out.push(`<div class="tip"><b>Tip:</b> ${inline(l.slice(2))}</div>`);return}
    if(list.length){out.push(`<ul>${list.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`);list=[]}para.push(l)});
  flush();return out.join("\n")}
